# -Xmx réduit pour rester compatible avec les machines à faible RAM (ex: 4 Go
# total) : -Xmx8G provoquait un crash "Native memory allocation (malloc)
# failed" pendant la compilation R8/D8, la JVM demandant plus de mémoire que
# la machine n'en a physiquement.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
org.gradle.parallel=false
# Un seul worker Gradle à la fois : limite le nombre de process (donc de
# mémoire) lancés en parallèle sur une machine à faible RAM.
org.gradle.workers.max=1
# Pas de daemon persistant : sur une machine à 4 Go de RAM, un daemon Gradle
# qui reste en mémoire entre les builds finit par ne plus laisser assez de
# place au JVM du build suivant (c'est ce qui causait le crash "daemon
# disappeared"). Chaque build démarre "propre" et libère tout à la fin.
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
