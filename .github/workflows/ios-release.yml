name: iOS release build

# Déclenchement manuel uniquement : publier une version iOS est une action
# délibérée (comme l'upload manuel sur Play Console pour Android), pas
# quelque chose qu'on veut voir se déclencher à chaque push.
on:
  workflow_dispatch: {}

jobs:
  build-and-upload:
    # macos-15 (Xcode 16+, SDK iOS 18) requis : in_app_purchase_storekit
    # utilise des API StoreKit 2 récentes ("win-back offers", iOS 18) qui
    # n'existent pas dans le SDK iOS 17 fourni par défaut sur macos-14
    # (Xcode 15.x) -- échouait avec "has no member 'winBackOffers'" etc.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Au niveau du job (pas d'une step) : c'est la seule façon d'utiliser
      # `secrets` dans un `if:` de step -- GitHub interdit `secrets`
      # directement dans une condition `if:`.
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      # Force la dernière Xcode stable disponible sur le runner (SDK iOS le
      # plus récent) : certains plugins Flutter (device_info_plus,
      # in_app_purchase_storekit...) utilisent des API iOS récentes non
      # déclarées dans le SDK par défaut du runner, ce qui casse la
      # compilation ("No visible @interface ... declares the selector").
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Sur un checkout tout neuf, `flutter pub get` tente de préparer
      # build/ios/SourcePackages/ (support Swift Package Manager de
      # Flutter pour les plugins) avant que ce dossier existe, ce qui fait
      # échouer un `rsync mkdir` -- bug connu sur un premier build propre.
      # Le créer à l'avance suffit à l'éviter.
      - name: Prépare le dossier SourcePackages
        run: mkdir -p build/ios/SourcePackages

      - name: flutter pub get
        run: flutter pub get

      - name: pod install
        run: pod install
        working-directory: ios

      # ---------------------------------------------------------------
      # Signature : importe le certificat de distribution + le profil de
      # provisioning dans un trousseau (keychain) temporaire propre à ce
      # run, pour ne jamais laisser de clé privée traîner sur le runner
      # au-delà de ce job.
      # ---------------------------------------------------------------
      - name: Importe le certificat et le profil de provisioning
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Certificat intermédiaire Apple (WWDR) : sans lui, la chaîne de
          # confiance de notre certificat de distribution est incomplète et
          # `security find-identity` (utilisé par xcodebuild) ne le compte
          # pas comme une identité de signature valide, même s'il est
          # correctement importé.
          curl -s -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security

          # -T /usr/bin/codesign : autorise l'outil codesign à utiliser la clé
          # privée importée sans prompt interactif -- indispensable en CI
          # headless, sinon xcodebuild ne trouve "aucun certificat valide"
          # même si l'import a réussi.
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/ci.mobileprovision

      - name: Génère ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.habitudeplus.habitTracker</key>
              <string>${PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      # ---------------------------------------------------------------
      # Ajoute DEVELOPMENT_TEAM et PROVISIONING_PROFILE_SPECIFIER pour que
      # l'étape d'ARCHIVE (avant l'export régi par ExportOptions.plist)
      # utilise elle aussi la signature manuelle (CODE_SIGN_STYLE = Manual,
      # déjà fixé dans project.pbxproj).
      #
      # Injecté dans Flutter/Release.xcconfig, PAS en patchant
      # project.pbxproj avec sed : le pbxproj est un plist "old-style" à la
      # grammaire stricte, et un patch sed y a provoqué à plusieurs reprises
      # une corruption ("missing semicolon in dictionary") que même
      # xcodebuild ne pouvait plus parser -- alors même que les valeurs
      # injectées semblaient propres. Le format .xcconfig (clé = valeur,
      # une par ligne) est prévu pour ce genre d'injection dynamique et ne
      # partage pas cette fragilité.
      # ---------------------------------------------------------------
      - name: Configure la signature manuelle dans le projet Xcode
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          TEAM_ID_CLEAN=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '\n\r ')
          PROFILE_NAME_CLEAN=$(printf '%s' "$PROVISIONING_PROFILE_NAME" | tr -d '\n\r')

          {
            echo "DEVELOPMENT_TEAM = ${TEAM_ID_CLEAN}"
            echo "PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME_CLEAN}"
          } >> ios/Flutter/Release.xcconfig

          echo "--- Vérification post-ajout ---"
          cat ios/Flutter/Release.xcconfig

      # ---------------------------------------------------------------
      # Build release avec obfuscation, même logique que le build Android
      # de ce projet (voir README, section "Protection du code").
      # ---------------------------------------------------------------
      - name: flutter build ipa
        run: |
          flutter build ipa --release \
            --obfuscate --split-debug-info=build/debug-info-ios \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive le .ipa et les symboles de debug
        uses: actions/upload-artifact@v4
        with:
          name: habitude-plus-ios
          path: |
            build/ios/ipa/*.ipa
            build/debug-info-ios/**
          retention-days: 90

      # ---------------------------------------------------------------
      # Upload vers App Store Connect (TestFlight). Ne s'exécute que si
      # la clé API est configurée -- sinon le job s'arrête après avoir
      # produit le .ipa signé, à uploader manuellement via Transporter.
      # ---------------------------------------------------------------
      - name: Upload vers App Store Connect
        if: ${{ env.APPSTORE_API_KEY_ID != '' }}
        env:
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPSTORE_API_PRIVATE_KEY_BASE64" | base64 --decode \
            -o ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

          IPA_PATH=$(find build/ios/ipa -name '*.ipa' | head -n1)
          # `altool` peut rendre un exit code 0 tout en affichant une ligne
          # "ERROR:" (bug connu, ex. "Cannot determine the Apple ID from
          # Bundle ID" quand la fiche app n'existe pas encore dans App Store
          # Connect) -- capturer la sortie et vérifier explicitement, sinon
          # le job passe en succès alors que rien n'a été uploadé.
          OUTPUT=$(xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID" 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "ERROR"; then
            echo "##[error]altool a rapporté une erreur malgré un exit code 0 -- voir ci-dessus."
            exit 1
          fi
