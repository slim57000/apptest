name: habit_tracker
description: "Habitude+ — suivi d'habitudes avec abonnement Premium."
publish_to: 'none'

version: 1.0.0+6

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Etat de l'application
  provider: ^6.1.2

  # Stockage local (aucun backend requis pour la v1)
  shared_preferences: ^2.3.3

  # Abonnement Premium (App Store / Play Store billing)
  in_app_purchase: ^3.3.0

  # Formatage dates
  intl: ^0.20.3

  # Rappels locaux quotidiens
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  # Nom du fuseau horaire de l'appareil (pour tz.setLocalLocation)
  flutter_timezone: ^4.1.0

  # Design : typographie, micro-animations, graphiques, confettis
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  confetti: ^0.8.0

  # Partage de la carte de série (image générée)
  share_plus: ^13.3.0
  path_provider: ^2.1.6

  # Suivi automatique des pas via Health Connect (Android) / Apple Health (iOS)
  health: ^13.3.2

  # Défis entre amis (backend Supabase — voir supabase/schema.sql)
  supabase_flutter: ^2.17.2

  # Ouvrir la politique de confidentialité depuis les réglages
  url_launcher: ^6.3.1

  # Publicité (bannière discrète, uniquement en version gratuite)
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  # Requis par AppLogo (lib/widgets/app_logo.dart), qui affiche
  # assets/icon/icon_foreground.png directement dans l'UI (pas seulement
  # comme source pour flutter_launcher_icons).
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#2563EB"
    theme_color: "#2563EB"
